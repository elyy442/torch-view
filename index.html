<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torch — 3D Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #111;
      --poster-color: #111;
    }
    .caption {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <model-viewer
    src="model.glb"
    alt="3D model: Torch"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    rotation-per-second="12deg"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="none"
  ></model-viewer>
  <div class="caption">Drag to rotate &middot; scroll/pinch to zoom</div>
</body>
</html>
